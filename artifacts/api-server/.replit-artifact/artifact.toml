kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "bash -c 'cd /home/runner/workspace/artifacts/api-server && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2'"

[services.env]
PORT = "8080"

[services.production]

[services.production.build]
args = ["pip", "install", "-r", "artifacts/api-server/requirements.txt", "--quiet"]

[services.production.run]
args = ["bash", "-c", "cd /home/runner/workspace/artifacts/api-server && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
