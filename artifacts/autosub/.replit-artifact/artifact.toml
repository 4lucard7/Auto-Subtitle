kind = "web"
previewPath = "/"
title = "AutoSub"
version = "1.0.0"
id = "artifacts/autosub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19564

[services.development]
run = "pnpm --filter @workspace/autosub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/autosub", "run", "build" ]
publicDir = "artifacts/autosub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19564"
BASE_PATH = "/"
