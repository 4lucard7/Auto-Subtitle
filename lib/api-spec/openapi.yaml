openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AutoSub API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: jobs
    description: Subtitle job operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List all subtitle jobs
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /jobs/{jobId}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get job status and results
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/{jobId}/subtitles:
    get:
      operationId: getJobSubtitles
      tags: [jobs]
      summary: Get subtitle segments for a job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: lang
          in: query
          required: false
          schema:
            type: string
            default: original
      responses:
        "200":
          description: Subtitle segments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubtitleResult"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/stats:
    get:
      operationId: getJobStats
      tags: [jobs]
      summary: Get overall statistics
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SubtitleSegment:
      type: object
      properties:
        index:
          type: integer
        start:
          type: number
        end:
          type: number
        text:
          type: string
      required:
        - index
        - start
        - end
        - text

    Job:
      type: object
      properties:
        id:
          type: string
        filename:
          type: string
        status:
          type: string
          enum: [pending, extracting, transcribing, translating, done, error]
        progress:
          type: integer
        step:
          type: string
        detected_language:
          type: ["string", "null"]
        target_language:
          type: ["string", "null"]
        error_message:
          type: ["string", "null"]
        duration_seconds:
          type: ["number", "null"]
        segment_count:
          type: ["integer", "null"]
        created_at:
          type: string
        completed_at:
          type: ["string", "null"]
      required:
        - id
        - filename
        - status
        - progress
        - step
        - detected_language
        - target_language
        - error_message
        - duration_seconds
        - segment_count
        - created_at
        - completed_at

    SubtitleResult:
      type: object
      properties:
        job_id:
          type: string
        language:
          type: string
        segments:
          type: array
          items:
            $ref: "#/components/schemas/SubtitleSegment"
        srt_content:
          type: string
      required:
        - job_id
        - language
        - segments
        - srt_content

    JobStats:
      type: object
      properties:
        total_jobs:
          type: integer
        completed_jobs:
          type: integer
        processing_jobs:
          type: integer
        failed_jobs:
          type: integer
        total_minutes_processed:
          type: number
        supported_languages:
          type: array
          items:
            type: string
      required:
        - total_jobs
        - completed_jobs
        - processing_jobs
        - failed_jobs
        - total_minutes_processed
        - supported_languages
